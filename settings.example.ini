# Copy to settings.ini and edit. settings.ini is gitignored; this file is not,
# so never put real paths here.
#
# Values are read literally: no quoting, no escapes. Spaces are fine.
# A Windows path goes in as-is:  game = C:\Games\Grim Dawn
# Avoid '%' in a path -- the parser is built with interpolation disabled, but
# other INI readers will choke on it.

[paths]

# Game install root. Must contain database/database.arz and resources/*.arc.
#   Linux/Steam : ~/.steam/steam/steamapps/common/Grim Dawn
#   Windows     : C:\Program Files (x86)\Steam\steamapps\common\Grim Dawn
game =

# Save root: the directory holding main/ plus formulas.gst and transfer.*st.
# On Steam this is the CLOUD save dir, keyed by your Steam ID3 -- the save/
# folder inside the game install is usually empty.
#   Linux/Steam : ~/.steam/steam/userdata/<steamID3>/219990/remote/save
#   Windows     : C:\Users\<you>\Documents\My Games\Grim Dawn\save
saves =

# Item Assistant for Grim Dawn database FILE (not its folder). The sibling
# userdata.db-wal and userdata.db-shm are found relative to it and must be
# readable too, or recent stash changes will be missing.
#   Linux/Proton: <steam>/steamapps/compatdata/219990/pfx/drive_c/users/steamuser/AppData/Local/EvilSoft/IAGD/data/userdata.db
#   Windows     : C:\Users\<you>\AppData\Local\EvilSoft\IAGD\data\userdata.db
iagd =
